<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-06</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Left Image -->
        <div class="img">
            <img src="img.jpg" alt="Laundry Image">
        </div>


        <!-- Right Login Page -->
        <div class="loginpage">

            <h1>Hello Again!</h1>

            <p>Welcome back to Laundry Wallah</p>


            <form class="form">

                <label for="email">Email</label>

                <input 
                    id="email"
                    type="email" 
                    placeholder="Emailid@site.com" 
                    required
                >


                <label for="pw">Password</label>

                <input 
                    id="pw"
                    type="password" 
                    placeholder="Password" 
                    required
                >


                

            </form>
            <a id="fp" href="#">Forgot Password?</a>
             <button>Login</button>
             <p id="register">Not a member? <span><a href="#">register now</a></span></p>

        </div>

    </div>

</body>
</html>
